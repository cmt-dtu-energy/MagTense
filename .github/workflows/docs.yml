name: TechManual build and publish

# The website at https://cmt-dtu-energy.github.io/MagTense is served by GitHub
# Pages straight from the committed HTML in docs/ on master - the
# pages-build-deployment job that appears in the Actions tab is GitHub's own
# deploy step and does not run Sphinx. This workflow is what turns
# docs/source/*.rst into that HTML: it checks every change to the sources, and
# on master it rebuilds docs/ and commits the result so the change reaches the
# site.

on:
  push:
    branches: [master, develop]
    paths:
      - 'docs/source/**'
      - 'docs/requirements.txt'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/source/**'
      - 'docs/requirements.txt'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: techmanual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the TechManual
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: docs/requirements.txt

    - name: Install Sphinx
      run: python -m pip install -r docs/requirements.txt

    - name: Build
      # -W makes any Sphinx warning fail the job, which is what keeps broken
      # cross-references and malformed tables out of the sources. -n adds the
      # nitpicky checks on top of that.
      run: python -m sphinx -b html -W -n docs/source "${{ runner.temp }}/html"

    - name: Upload the built site
      uses: actions/upload-artifact@v4
      with:
        name: techmanual-html
        path: ${{ runner.temp }}/html

  publish:
    name: Publish to docs/
    # Only master is served by Pages, and a pull request must never write to the
    # repository.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: docs/requirements.txt

    - name: Install Sphinx
      run: python -m pip install -r docs/requirements.txt

    - name: Rebuild the published HTML
      # No -W here: a warning should block a pull request, but it should not
      # stop an already-merged fix from reaching the website.
      run: |
        set -euo pipefail
        python -m sphinx -b html docs/source "$RUNNER_TEMP/html"
        test -f "$RUNNER_TEMP/html/index.html"
        # Delete only what Sphinx regenerates. docs/README.md and docs/.nojekyll
        # are hand-maintained and must survive. Removing the old files rather
        # than copying over them is what clears out pages whose source has been
        # deleted - the site currently still serves four such orphans.
        rm -rf docs/_images docs/_sources docs/_static
        find docs -maxdepth 1 -type f \
          \( -name '*.html' -o -name '*.js' -o -name '*.inv' -o -name '.buildinfo' \) -delete
        cp -a "$RUNNER_TEMP/html/." docs/

    - name: Commit if the site changed
      run: |
        set -euo pipefail
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        # Stage first and then compare against the index: a rebuild that only
        # adds pages leaves "git diff" empty, because new files are untracked
        # until they are staged.
        git add -A docs
        if git diff --cached --quiet -- docs; then
          echo "The built site is unchanged - nothing to commit."
          exit 0
        fi
        git commit -m "docs: rebuild the TechManual from docs/source" \
                   -m "Generated by .github/workflows/docs.yml from ${{ github.sha }}."
        git push
