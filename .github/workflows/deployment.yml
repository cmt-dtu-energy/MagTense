on:
  release:
    types: [published]

jobs:
  build-and-testing:
    name: Build and test pip-wheels
    uses: ./.github/workflows/python-package-conda.yml
  
  pypi-publish:
    name: Upload release to PyPI
    runs-on: ubuntu-latest
    needs: build-and-testing
    environment:
      name: testpypi
      url: https://test.pypi.org/project/magtense/
    permissions:
      id-token: write
    steps:
    - name: Win - Download py312 pip-wheel
      uses: actions/download-artifact@v4
      with:
        name: pip-wheel-py312-cu12-Windows

    - name: Win - Download py313 pip-wheel
      uses: actions/download-artifact@v4
      with:
        name: pip-wheel-py313-cu12-Windows

    - name: Linux - Download py312 pip-wheel
      uses: actions/download-artifact@v4
      with:
        name: pip-wheel-py312-cu12-Linux

    - name: Linux - Download py313 pip-wheel
      uses: actions/download-artifact@v4
      with:
        name: pip-wheel-py313-cu12-Linux

    - name: Get latest tag
      id: previoustag
      uses: WyriHaximus/github-action-get-previous-tag@v1

    - name: Move wheels to dist/
      run: |
        mkdir dist/
        mv ${{ github.workspace }}/*.whl dist/
        ls -al dist/
    
    - name: Rename wheels with cuda
      working-directory: dist/
      run: |
        mv magtense-${{ steps.previoustag.outputs.tag }}-1-py312-none-win_amd64.whl magtense-${{ steps.previoustag.outputs.tag }}-py312-none-win_amd64.whl
        mv magtense-${{ steps.previoustag.outputs.tag }}-1-py313-none-win_amd64.whl magtense-${{ steps.previoustag.outputs.tag }}-py313-none-win_amd64.whl
        mv magtense-${{ steps.previoustag.outputs.tag }}-1-py312-none-manylinux1_x86_64.whl magtense-${{ steps.previoustag.outputs.tag }}-py312-none-manylinux1_x86_64.whl
        mv magtense-${{ steps.previoustag.outputs.tag }}-1-py313-none-manylinux1_x86_64.whl magtense-${{ steps.previoustag.outputs.tag }}-py313-none-manylinux1_x86_64.whl

    - name: Publish package distributions to TestPyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      # TODO Remove two lines below for publishing to PyPI
      with:
        repository-url: https://test.pypi.org/legacy/
