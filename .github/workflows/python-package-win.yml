name: Python pip-wheel via make python-interface-win (Windows, CPU)

on:
  pull_request:
    branches:
      - master
  workflow_call:
    inputs:
      tag:
        required: false
        type: string
  push:
    branches:
      - fabio-makefile-win
  workflow_dispatch:

jobs:
  build-cvode:
    name: cvode
    uses: ./.github/workflows/cmake-sundials-cvode.yml

  build-wheel:
    runs-on: windows-2022
    needs: [build-cvode]
    strategy:
      # The legs are independent wheels, and a transient conda/anaconda.org
      # failure on one of them should not cancel the other two.
      fail-fast: false
      matrix:
        py-version:
          - { version: "312", semver: "3.12" }
          - { version: "313", semver: "3.13" }
          - { version: "314", semver: "3.14" }
    defaults:
      run:
        shell: bash -el {0}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Fetch tags
      if: "${{ inputs.tag == '' }}"
      run: git fetch --tags origin

    - name: Get latest release tag
      id: previoustag
      if: "${{ inputs.tag == '' }}"
      uses: WyriHaximus/github-action-get-previous-tag@v1
      with:
        fallback: 1.0.0

    # icx-cl/ifx link against the MSVC CRT and Windows SDK, but neither
    # oneAPI's own setvars nor the conda env's vs2022_win-64 package reliably
    # pick up the toolset on the GitHub-hosted windows-2022 image, leaving LIB
    # without kernel32.lib etc. - see the same note in cmake-sundials-cvode.yml.
    # Set the MSVC env explicitly rather than relying on conda alone.
    - name: Setup msvc-dev-cmd
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: amd64

    - name: Setup Miniforge
      uses: conda-incubator/setup-miniconda@v3
      with:
        miniforge-version: latest
        activate-environment: magtense-env
        environment-file: python/.build/env-${{ matrix.py-version.version }}-win-cpu.yml
        use-mamba: true

    - name: Download cvode (sundials)
      uses: actions/download-artifact@v4
      with:
        name: cvode-Windows
        path: ${{ github.workspace }}/cvode/

    # msvc-dev-cmd puts the real MSVC link.exe on PATH, which the conda env's
    # own copy (from its msys2/binutils-flavoured packages) would otherwise
    # shadow depending on PATH order, producing confusing link errors.
    - name: Win - Delete link.exe
      run: rm '${{ env.CONDA }}'/envs/magtense-env/Library/usr/bin/link.exe

    # -NoExit was masking the script's exit code in an earlier workflow, so a
    # failed make still passed this step and produced a wheel with no
    # extension module in it. $LASTEXITCODE has to be checked explicitly: a
    # non-zero exit from a native command does not trip $ErrorActionPreference.
    - name: Build Python interface via make python-interface-win
      shell: pwsh -ExecutionPolicy Bypass -File {0}
      working-directory: ${{ github.workspace }}
      run: |
        $ErrorActionPreference = "Stop"
        make python-interface-win USE_CUDA=0
        if ($LASTEXITCODE -ne 0) { throw "make python-interface-win failed (exit $LASTEXITCODE)" }

    # dist_pypi.py expects the compiled extension staged at
    # python/<cu_version>_libs/magtensesource.cp<py>-win_amd64.pyd. The
    # properly-named module (not the bare f2py output at the repo root) lands
    # in python/src/magtense/lib/ after python-interface-win's editable install.
    - name: Stage .pyd for dist_pypi.py
      working-directory: ${{ github.workspace }}
      run: |
        mkdir -p python/cpu_libs
        cp python/src/magtense/lib/magtensesource.cp${{ matrix.py-version.version }}-win_amd64.pyd python/cpu_libs/

    - name: Build pip-wheel
      if: "${{ inputs.tag == '' }}"
      working-directory: ${{ github.workspace }}/python/
      run: |
        sed -i 's/1.0.0/${{ steps.previoustag.outputs.tag }}/' src/magtense/__init__.py
        python .build/dist_pypi.py --py_version ${{ matrix.py-version.version }} --cu_version cpu --platform win --pkg_version ${{ steps.previoustag.outputs.tag }}

    - name: Deployment - Build pip-wheel
      if: "${{ inputs.tag != '' }}"
      working-directory: ${{ github.workspace }}/python/
      run: |
        sed -i 's/1.0.0/${{ inputs.tag }}/' src/magtense/__init__.py
        python .build/dist_pypi.py --py_version ${{ matrix.py-version.version }} --cu_version cpu --platform win --pkg_version ${{ inputs.tag }}

    - name: Archive pip-wheel
      uses: actions/upload-artifact@v4
      with:
        name: pip-wheel-py${{ matrix.py-version.version }}-cpu-Windows
        path: ${{ github.workspace }}/python/dist/magtense-*-0-py${{ matrix.py-version.version }}-none-win_amd64.whl


  test-wheel:
    runs-on: windows-2022
    needs: build-wheel
    strategy:
      fail-fast: false
      matrix:
        py-version:
          - { version: "312", semver: "3.12" }
          - { version: "313", semver: "3.13" }
          - { version: "314", semver: "3.14" }
    defaults:
      run:
        shell: bash -el {0}

    steps:
    - name: Checkout test scripts
      uses: actions/checkout@v4
      with:
        sparse-checkout: |
          python/util/
          python/examples/
          documentation/examples_FEM_validation/
          documentation/examples_mumag_validation/

    - name: Download wheel artifact
      uses: actions/download-artifact@v4
      with:
        name: pip-wheel-py${{ matrix.py-version.version }}-cpu-Windows

    - name: Setup python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.py-version.semver }}

    - name: Install pip-wheel and run pytest
      env:
        MAGTENSE_USE_FMM3D: 0
        MAGTENSE_WHEEL_VARIANT: cpu
      run: |
        python -m pip install '${{ github.workspace }}'/*.whl
        python -m pip install pytest
        python -m pytest python/examples/magnetostatics/test_magtense.py \
                          python/examples/micromagnetism/MagTense_tests

    # python/examples/micromagnetism/testMagTenseFunctions.py is the combined micromagnetic
    # suite. It runs the validation examples, compares every measure with the limit that
    # belongs to it, and exits non zero when one of them is over its limit, so this step
    # fails on a numerical regression and not only on a crash. matplotlib and scipy are not
    # dependencies of the wheel, but the examples need them.
    #
    # Standard problem 6 is about seventy percent of the running time of the suite, so it is
    # left out on most of the matrix and the whole suite runs on one leg of it.
    - name: Run the combined micromagnetic test suite
      if: ${{ matrix.py-version.semver != '3.13' }}
      run: |
        python -m pip install matplotlib scipy
        python python/examples/micromagnetism/testMagTenseFunctions.py --skip std_problem_6

    - name: Run the whole combined micromagnetic test suite
      if: ${{ matrix.py-version.semver == '3.13' }}
      run: |
        python -m pip install matplotlib scipy
        python python/examples/micromagnetism/testMagTenseFunctions.py

    - name: Upload the overview of the test suite
      if: ${{ always() && matrix.py-version.semver == '3.13' }}
      uses: actions/upload-artifact@v4
      with:
        name: test-suite-py${{ matrix.py-version.version }}-cpu-Windows
        path: python/examples/micromagnetism/testMagTenseFunctions_overview.png
        if-no-files-found: ignore
