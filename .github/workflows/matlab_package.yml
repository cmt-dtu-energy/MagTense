name: Building and testing Matlab MEX files on Windows and Linux

on: [push, workflow_dispatch]

jobs:
  build-linux:
    strategy:
      matrix:
        py-version: [312]
        mat-version: [R2024a]
        CVODE-compile: [CVODE]
        CUDA-compile: [noCUDA]
    runs-on: ubuntu-latest
    needs: [build-cvode]
    defaults:
      run:
        shell: bash -el {0}
    env:
      build_file: python/.build/env-${{ matrix.py-version}}-linux.yml

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Miniforge
      uses: conda-incubator/setup-miniconda@v3
      with:
        miniforge-version: latest
        activate-environment: magtense-env
        use-mamba: true

    - name: Cache conda
      uses: actions/cache@v4
      env:
        # Increase this value to reset cache manually
        cache_number: 0
      with:
        path: ${{ env.CONDA }}/envs
        key: conda-${{ runner.os }}-${{ hashFiles(env.build_file) }}-${{ env.cache_number }}
      id: cache

    - name: Update environment if needed
      run: conda env update -n magtense-env -f ${{ env.build_file }}
      if: steps.cache.outputs.cache-hit != 'true'

    - name: Download cvode (sundials-7.2.1)
      uses: actions/download-artifact@v4
      with:
          name: cvode-Linux
          path: ${{ github.workspace }}/cvode/

    - name: Set up MATLAB R2024X
      uses: matlab-actions/setup-matlab@v2
      with:
        release: ${{ matrix.mat-version }}

    - name: Compile Fortran source code with CUDA including R2024X
      env:
          CUDA: ${{ matrix.CUDA-compile == 'noCUDA' && '0' || '1' }}
          CVODE: ${{ matrix.CVODE-compile == 'noCVODE' && '0' || '1' }}
          MATLAB: ${{ matrix.mat-version == 'R2024a' && '1' || '2' }}
      working-directory: ${{ github.workspace }}
      run: make magnetostatic micromagnetism cuda forceintegrator USE_CUDA=$CUDA USE_CVODE=$CVODE USE_MATLAB=1 MATLAB_INCLUDE=/opt/hostedtoolcache/MATLAB/2024.$MATLAB.999/x64/extern/include
      #MATLAB_INCLUDE=/opt/hostedtoolcache/MATLAB/2024.1.999/x64/extern/include for R2024a
      #MATLAB_INCLUDE=/opt/hostedtoolcache/MATLAB/2024.2.999/x64/extern/include for R2024b 
   
    - name: Compile MEX code using Matlab with CUDA
      env:
          CUDA: ${{ matrix.CUDA-compile == 'noCUDA' && '0' || '1' }}
          CVODE: ${{ matrix.CVODE-compile == 'noCVODE' && '0' || '1' }}
      uses: matlab-actions/run-command@v2
      with:
        command: cd('matlab'); USE_CUDA = str2num(getenv('CUDA')); USE_CVODE = str2num(getenv('CVODE')); buildMagTenseMEX('USE_RELEASE', true, 'USE_CUDA', USE_CUDA, 'USE_CVODE', USE_CVODE);  


    - name: Examine2
      if: ${{ runner.os == 'Linux' }}
      run: |
        ldd /home/runner/work/MagTense/MagTense/matlab/MEX_files/MagTenseLandauLifshitzSolverNoCUDA_mex.mexa64

    - name: Archive MEX-files
      uses: actions/upload-artifact@v4
      with:
        name: MEX-Linux_${{ matrix.CVODE-compile}}_${{ matrix.CUDA-compile}}
        path: ${{ github.workspace }}/matlab/MEX_files/*

###
    
  test-linux:
    strategy:
      matrix:
        mat-version: [R2024a] #Note that R2024b always crashes with segmentation fault
        os-version: [ubuntu-latest]
        CUDA-compile: [noCUDA]
        CVODE-compile: [CVODE]
        CUDA-run: [noCUDA] #[CUDA,noCUDA]
        CVODE-run: [CVODE,noCVODE]
        exclude:
        - CUDA-compile: noCUDA
          CUDA-run: CUDA
        - CUDA-compile: CUDA
          CUDA-run: noCUDA
        - CVODE-compile: noCVODE
          CVODE-run: CVODE 
    runs-on: ["${{ matrix.os-version }}"]
    needs: build-linux
    defaults:
      run:
        shell: bash -el {0}
    
    steps:
    - name: Checkout test scripts
      uses: actions/checkout@v4
      with:
        sparse-checkout: |
          matlab
          documentation
      
    - name: Download the MEX files as an artifact
      uses: actions/download-artifact@v4
      with:
        name: MEX-Linux_${{ matrix.CVODE-compile}}_${{ matrix.CUDA-compile}}
        path: ${{ github.workspace }}/matlab/MEX_files

    - name: Set up MATLAB
      uses: matlab-actions/setup-matlab@v2
      with:
        release: "${{ matrix.mat-version }}"

    - name: Run test script on download MEX-file without CUDA
      uses: matlab-actions/run-command@v2
      env:
        CUDA: ${{ matrix.CUDA-run == 'noCUDA' && '0' || '1' }} 
        CVODE: ${{ matrix.CVODE-run == 'noCVODE' && '0' || '1' }} 
      with:
        command: USE_CUDA = str2num(getenv('CUDA')); USE_CVODE = str2num(getenv('CVODE')); cd('matlab/examples/Micromagnetism/mumag_micromag_Std_problem_4'); [~,~,~,~,~,~,int_error] = Standard_problem_4('USE_CUDA',USE_CUDA,'USE_CVODE',USE_CVODE); disp(int_error);

  build-cvode:
    name: cvode
    uses: ./.github/workflows/cmake-sundials-cvode.yml