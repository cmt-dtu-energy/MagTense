name: Matlab MEX files build and test on Windows and Linux

on:
  pull_request:
    branches:
      - master
  workflow_call:
    inputs:
      tag:
        required: false
        type: string
  workflow_dispatch:

jobs:
  build-windows:
    strategy:
      matrix:
        CVODE-compile: [CVODE,noCVODE]
        CUDA-compile: [CUDA,noCUDA]
    # CUDA 12.8's nvcc only supports host compilers up to VS 2022, but
    # windows-latest and windows-2025 both moved to VS 2026 in June 2026 and no
    # longer carry VS 2022 at all. windows-2022 is GitHub's supported fallback.
    # Lifting this pin requires a CUDA version that accepts a newer host
    # compiler, which means re-pinning cuda-* in python/.build/env-*-win.yml.
    runs-on: [windows-2022]
    needs: [build-cvode]
    env:
      build_file: python/.build/env-313-win.yml
    steps:
      - uses: actions/checkout@v4
        with:
          # FMM3D lives in external/FMM3D as a submodule; without this it is
          # not fetched and 'make fmm3d' has nothing to build.
          submodules: recursive

      - name: Win - Select FMM3D make.inc
        run: Copy-Item external/FMM3D/make.inc.windows external/FMM3D/make.inc

      - name: Setup Miniforge
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: magtense-env
          environment-file: ${{ env.build_file }}
          use-mamba: true

      # The runner image updates both the Visual Studio edition/year and the
      # MSVC toolset version, so those paths cannot be hardcoded. Resolve them
      # once here and reuse them via the environment in the steps below.
      - name: Locate Visual Studio and the MSVC toolset
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "vswhere.exe not found at $vswhere" }

          Write-Host "Visual Studio instances present on this image:"
          & $vswhere -all -products * -property installationPath

          # nvcc rejects any host compiler newer than VS 2022 (see crt/host_config.h),
          # and runner images now also ship VS 2026, so restrict the search to
          # [15.0,18.0) = VS 2017..2022 rather than taking whatever is newest.
          $vsDir = & $vswhere -latest -products * -version "[15.0,18.0)" -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsDir) { throw "No Visual Studio 2017-2022 installation with the MSVC toolset was found; nvcc does not support newer versions." }

          $versionFile = Join-Path $vsDir "VC\Auxiliary\Build\Microsoft.VCToolsVersion.default.txt"
          $toolsVersion = (Get-Content $versionFile -Raw).Trim()
          $hostBin = Join-Path $vsDir "VC\Tools\MSVC\$toolsVersion\bin\Hostx64\x64"
          if (-not (Test-Path (Join-Path $hostBin "cl.exe"))) { throw "cl.exe not found in $hostBin" }

          Write-Host "VS_INSTALL_DIR=$vsDir"
          Write-Host "MSVC_HOST_BIN=$hostBin"

          Add-Content -Path $env:GITHUB_ENV -Value "VS_INSTALL_DIR=$vsDir"
          Add-Content -Path $env:GITHUB_ENV -Value "MSVC_HOST_BIN=$hostBin"

      - name: Download cvode (sundials-7.2.1)
        uses: actions/download-artifact@v4
        with:
          name: cvode-Windows
          path: ${{ github.workspace }}/cvode/

      - name: Set up MATLAB R2024b
        uses: matlab-actions/setup-matlab@v2
        with:
          release: R2024b    
      
      - name: Use nvcc to build the CUDA file
        if: ${{ matrix.CUDA-compile == 'CUDA' }}
        shell: bash -el {0}
        working-directory: ${{ github.workspace }}/source/MagTenseFortranCuda/cuda
        run: |
          nvcc -c MagTenseCudaBlas.cu -ccbin "$MSVC_HOST_BIN" -o MagTenseCudaBlas.obj

      - name: Make the wrapper for the CUDA file using icx in a Developer PowerShell for VS 2022
        if: ${{ matrix.CUDA-compile == 'CUDA' }}
        shell: pwsh -NoExit -ExecutionPolicy ByPass -File {0}
        run: |
          & "$env:VS_INSTALL_DIR\Common7\Tools\Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64
          cd ${{ github.workspace }}/source/MagTenseFortranCuda/cuda
          make wrap
          ls
      
      - name: Build MagTense .o-files with or without CUDA using Developer PowerShell for VS 2022
        env:
          CUDA: ${{ matrix.CUDA-compile == 'noCUDA' && '0' || '1' }}
          CVODE: ${{ matrix.CVODE-compile == 'noCVODE' && '0' || '1' }}
        # No -NoExit: it keeps the shell alive past the script and masks the
        # exit code, so a failed make would pass this step and only surface
        # later as missing symbols at MEX link time.
        shell: pwsh -ExecutionPolicy ByPass -File {0}
        run: |
          & "$env:VS_INSTALL_DIR\Common7\Tools\Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64
          conda info
          cd ${{ github.workspace }}
          pwd

          # The MATLAB targets do not depend on fmm3d the way 'all' and
          # 'python' do, so the archive has to be built explicitly.
          make fmm3d USE_FMM3D=1
          if ($LASTEXITCODE -ne 0) { throw "make fmm3d failed (exit $LASTEXITCODE)" }

          make auxmt magnetostatic micromagnetism forceintegrator USE_CUDA=$env:CUDA USE_CVODE=$env:CVODE USE_MATLAB=1 USE_FMM3D=1 MATLAB_INCLUDE=D:/hostedtoolcache/windows/MATLAB/2024.2.999/x64/extern/include
          if ($LASTEXITCODE -ne 0) { throw "make of the MagTense libraries failed (exit $LASTEXITCODE)" }
      
      - name: Setup a symbolic link to the ifx compiler so that Matlab's "mex -setup FORTRAN" can find it
        shell: powershell
        run: |
          cd C:\Users\runneradmin\miniconda3\envs\magtense-env\Library 
          mkdir compiler 
          cd C:\Users\runneradmin\miniconda3\envs\magtense-env\Library\compiler
          mkdir 2024.2 
          cd 2024.2 
          cmd /c mklink /D bin C:\Users\runneradmin\miniconda3\envs\magtense-env\Library\bin 

      - name: Remove the GNU linker and setup a symbolic link to the VS linker instead
        shell: powershell
        run: |
          cd C:\Users\runneradmin\miniconda3\envs\magtense-env\Library\usr
          move bin bin_renamed
          cmd /c mklink /D bin "$env:MSVC_HOST_BIN"
      
      - name: Compile MEX code using Matlab with or without CUDA
        env:
          CUDA: ${{ matrix.CUDA-compile == 'noCUDA' && '0' || '1' }}
          CVODE: ${{ matrix.CVODE-compile == 'noCVODE' && '0' || '1' }}
        uses: matlab-actions/run-command@v2
        with:
          command: setenv('ONEAPI_ROOT',"C:\Users\runneradmin\miniconda3\envs\magtense-env\Library"); mex -setup FORTRAN; cd('D:/a/MagTense/MagTense/matlab'); USE_CUDA = str2num(getenv('CUDA')); USE_CVODE = str2num(getenv('CVODE'));  buildMagTenseMEX('USE_RELEASE',true,'USE_CUDA',USE_CUDA,'USE_CVODE',USE_CVODE,'USE_FMM3D',true,'mkl_include','C:\Users\runneradmin\miniconda3\envs\magtense-env\opt\compiler\include\intel64','mkl_lib','C:\Users\runneradmin\miniconda3\envs\magtense-env\Library\lib','mkl_lp64','C:\Users\runneradmin\miniconda3\envs\magtense-env\Library\include\intel64\lp64','cvode_include','D:\a\MagTense\MagTense\cvode\fortran','cvode_lib','D:\a\MagTense\MagTense\cvode\lib');
       
      - name: Check created MEX-files
        shell: bash -el {0}
        run: |
          dir D:/a/MagTense/MagTense/matlab/MEX_files
        
      - name: Archive MEX-files
        uses: actions/upload-artifact@v4
        with:
          name: MEX-Windows_${{ matrix.CVODE-compile}}_${{ matrix.CUDA-compile}}
          path: D:/a/MagTense/MagTense/matlab/MEX_files/*         
      
###

  test-windows:
    strategy:
      matrix:
        mat-version: [R2023a,R2023b,R2024a,R2024b,R2025a,R2025b]
        CUDA-compile: [CUDA,noCUDA]
        CVODE-compile: [CVODE,noCVODE]
        CUDA-run: [CUDA,noCUDA]
        CVODE-run: [CVODE,noCVODE]
        exclude:
        - CUDA-compile: noCUDA
          CUDA-run: CUDA
        - CUDA-compile: CUDA
          CUDA-run: noCUDA
        - CVODE-compile: noCVODE
          CVODE-run: CVODE       
    runs-on: [ self-hosted, Windows, "${{ matrix.CUDA-run }}"]
    needs: build-windows
    defaults:
      run:
        shell: bash -el {0}
    
    steps:
    - name: Checkout test scripts
      uses: actions/checkout@v4
      with:
        sparse-checkout: |
          matlab
          documentation
    
    - name: Download the MEX files as an artifact
      uses: actions/download-artifact@v4
      with:
        name: MEX-Windows_${{ matrix.CVODE-compile}}_${{ matrix.CUDA-compile}}
        path: ${{ github.workspace }}/matlab/MEX_files
        
    - name: Check that the MEX-files are there    
      shell: cmd /C CALL {0}
      run: |
        dir ${{ github.workspace }}\matlab\MEX_files 
    
    - name: Run the whole combined test suite
      env:
        MAGTENSE_TEST_CUDA: ${{ matrix.CUDA-run == 'noCUDA' && '0' || '1' }}
        MAGTENSE_TEST_CVODE: ${{ matrix.CVODE-run == 'noCVODE' && '0' || '1' }}
      shell: cmd /C CALL {0}
      run: |
        "C:\Program Files\MATLAB\${{ matrix.mat-version}}\bin\matlab.exe" -batch "cd('C:\actions-runner\_work\MagTense\MagTense\matlab\util'); testMagTenseFunctions"

    - name: Upload the overview of the test suite
      if: ${{ always() && matrix.mat-version == 'R2024b' }}
      uses: actions/upload-artifact@v4
      with:
        name: test-suite-Windows_${{ matrix.CVODE-compile }}_${{ matrix.CVODE-run }}_${{ matrix.CUDA-run }}
        path: ${{ github.workspace }}/matlab/util/results/*
        if-no-files-found: ignore

    #- name: Run the FMM accuracy test
    #  env:
    #    CUDA: ${{ matrix.CUDA-run == 'noCUDA' && '0' || '1' }}
    #  shell: cmd /C CALL {0}
    #  run: |
    #    "C:\Program Files\MATLAB\${{ matrix.mat-version}}\bin\matlab.exe" -batch "USE_CUDA = logical(str2num(getenv('CUDA'))); cd('C:\actions-runner\_work\MagTense\MagTense\matlab\examples\Micromagnetism\MagTense_tests'); run_fmm_test('USE_CUDA', USE_CUDA)"

#################################

  build-linux:
    strategy:
      matrix:
        py-version: [313]
        mat-version: [R2024a]
        CVODE-compile: [CVODE,noCVODE]
        CUDA-compile: [CUDA,noCUDA]
    runs-on: ubuntu-latest
    needs: [build-cvode]
    defaults:
      run:
        shell: bash -el {0}
    env:
      build_file: python/.build/env-${{ matrix.py-version}}-linux.yml

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        # FMM3D lives in external/FMM3D as a submodule; without this it is
        # not fetched and 'make fmm3d' has nothing to build.
        submodules: recursive

    - name: Linux - Select FMM3D make.inc
      run: cp external/FMM3D/make.inc.linux external/FMM3D/make.inc

    - name: Setup Miniforge
      uses: conda-incubator/setup-miniconda@v3
      with:
        miniforge-version: latest
        activate-environment: magtense-env
        use-mamba: true

    - name: Cache conda
      uses: actions/cache@v4
      env:
        # Increase this value to reset cache manually
        cache_number: 0
      with:
        path: ${{ env.CONDA }}/envs
        key: conda-${{ runner.os }}-${{ hashFiles(env.build_file) }}-${{ env.cache_number }}
      id: cache

    - name: Update environment if needed
      run: conda env update -n magtense-env -f ${{ env.build_file }}
      if: steps.cache.outputs.cache-hit != 'true'

    - name: Download cvode (sundials-7.2.1)
      uses: actions/download-artifact@v4
      with:
          name: cvode-Linux
          path: ${{ github.workspace }}/cvode/

    - name: Set up MATLAB R2024X
      uses: matlab-actions/setup-matlab@v2
      with:
        release: ${{ matrix.mat-version }}

    - name: Compile Fortran source code with CUDA including R2024X
      env:
          CUDA: ${{ matrix.CUDA-compile == 'noCUDA' && '0' || '1' }}
          CVODE: ${{ matrix.CVODE-compile == 'noCVODE' && '0' || '1' }}
          MATLAB: ${{ matrix.mat-version == 'R2024a' && '1' || '2' }}
      working-directory: ${{ github.workspace }}
      run: |
        # The MATLAB targets do not depend on fmm3d the way 'all' and 'python'
        # do, so the archive has to be built explicitly.
        make fmm3d USE_FMM3D=1
        make auxmt magnetostatic micromagnetism cuda forceintegrator USE_CUDA=$CUDA USE_CVODE=$CVODE USE_MATLAB=1 USE_FMM3D=1 MATLAB_INCLUDE=/opt/hostedtoolcache/MATLAB/2024.$MATLAB.999/x64/extern/include
      #MATLAB_INCLUDE=/opt/hostedtoolcache/MATLAB/2024.1.999/x64/extern/include for R2024a
      #MATLAB_INCLUDE=/opt/hostedtoolcache/MATLAB/2024.2.999/x64/extern/include for R2024b 
   
    - name: Compile MEX code using Matlab with CUDA
      env:
          CUDA: ${{ matrix.CUDA-compile == 'noCUDA' && '0' || '1' }}
          CVODE: ${{ matrix.CVODE-compile == 'noCVODE' && '0' || '1' }}
      uses: matlab-actions/run-command@v2
      with:
        command: cd('matlab'); USE_CUDA = str2num(getenv('CUDA')); USE_CVODE = str2num(getenv('CVODE')); buildMagTenseMEX('USE_RELEASE', true, 'USE_CUDA', USE_CUDA, 'USE_CVODE', USE_CVODE, 'USE_FMM3D', true);  

    - name: Archive MEX-files
      uses: actions/upload-artifact@v4
      with:
        name: MEX-Linux_${{ matrix.CVODE-compile}}_${{ matrix.CUDA-compile}}
        path: ${{ github.workspace }}/matlab/MEX_files/*

###
    
  test-linux:
    strategy:
      matrix:
        mat-version: [R2023a,R2023b,R2024a,R2024b,R2025a,R2025b]   #Note that R2024b, R2025a and R2025b always crashes with segmentation fault
        os-version: [ubuntu-latest,ubuntu_CUDA]
        CVODE-compile: [CVODE,noCVODE]
        CUDA-compile: [CUDA,noCUDA]
        CVODE-run: [CVODE,noCVODE]
        CUDA-run: [CUDA,noCUDA]
        exclude:
        - CUDA-compile: noCUDA
          CUDA-run: CUDA
        - CUDA-compile: CUDA
          CUDA-run: noCUDA
        - CVODE-compile: noCVODE
          CVODE-run: CVODE
        - os-version: ubuntu_CUDA
          CUDA-compile: noCUDA
        - os-version: ubuntu-latest
          CUDA-compile: CUDA  
    runs-on: ["${{ matrix.os-version }}"]
    needs: build-linux
    defaults:
      run:
        shell: bash -el {0}
    
    steps:
    - name: Checkout test scripts
      uses: actions/checkout@v4
      with:
        sparse-checkout: |
          matlab
          documentation
      
    - name: Download the MEX files as an artifact
      uses: actions/download-artifact@v4
      with:
        name: MEX-Linux_${{ matrix.CVODE-compile}}_${{ matrix.CUDA-compile}}
        path: ${{ github.workspace }}/matlab/MEX_files

    - name: Set up MATLAB
      if: ${{ matrix.os-version == 'ubuntu-latest' }}
      uses: matlab-actions/setup-matlab@v2
      with:
        release: "${{ matrix.mat-version }}"

    - name: Run the whole combined test suite
      if: ${{ matrix.os-version == 'ubuntu-latest' }}
      continue-on-error: true
      uses: matlab-actions/run-command@v2
      env:
        MAGTENSE_TEST_CUDA: ${{ matrix.CUDA-run == 'noCUDA' && '0' || '1' }}
        MAGTENSE_TEST_CVODE: ${{ matrix.CVODE-run == 'noCVODE' && '0' || '1' }}
      with:
        command: cd('matlab/util'); testMagTenseFunctions;

    - name: Run the whole combined test suite with CUDA
      if: ${{ matrix.os-version == 'ubuntu_CUDA' }}
      continue-on-error: true
      env:
        MAGTENSE_TEST_CUDA: ${{ matrix.CUDA-run == 'noCUDA' && '0' || '1' }}
        MAGTENSE_TEST_CVODE: ${{ matrix.CVODE-run == 'noCVODE' && '0' || '1' }}
      run: |
        /usr/local/MATLAB/${{ matrix.mat-version}}/bin/matlab -batch "cd('matlab/util'); testMagTenseFunctions";

    #- name: Run the FMM accuracy test
    #  if: ${{ matrix.os-version == 'ubuntu-latest' }}
    #  continue-on-error: true
    #  uses: matlab-actions/run-command@v2
    #  env:
    #    CUDA: ${{ matrix.CUDA-run == 'noCUDA' && '0' || '1' }}
    #  with:
    #    command: USE_CUDA = logical(str2num(getenv('CUDA'))); cd('matlab/examples/Micromagnetism/MagTense_tests'); run_fmm_test('USE_CUDA', USE_CUDA);

    #- name: Run the FMM accuracy test with CUDA
    #  if: ${{ matrix.os-version == 'ubuntu_CUDA' }}
    #  continue-on-error: true
    #  env:
    #    CUDA: ${{ matrix.CUDA-run == 'noCUDA' && '0' || '1' }}
    #  run: |
    #    /usr/local/MATLAB/${{ matrix.mat-version}}/bin/matlab -batch "USE_CUDA = logical(str2num(getenv('CUDA'))); cd('matlab/examples/Micromagnetism/MagTense_tests'); run_fmm_test('USE_CUDA', USE_CUDA)";


  build-cvode:
    name: cvode
    uses: ./.github/workflows/cmake-sundials-cvode.yml
