name: Python pip-wheel via make python-interface (Linux, CPU + CUDA)

on:
  pull_request:
    branches:
      - master
  workflow_call:
    inputs:
      tag:
        required: false
        type: string
  push:
    branches:
      - fabio
  workflow_dispatch:

jobs:
  build-wheel:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cuda:
          - { use: 1, name: cu12, build_tag: 1, libs_dir: cu12_libs }
          - { use: 0, name: cpu,  build_tag: 0, libs_dir: cpu_libs  }
        py-version:
          - { version: "312", semver: "3.12" }
          - { version: "313", semver: "3.13" }
          - { version: "314", semver: "3.14" }
    defaults:
      run:
        shell: bash -el {0}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Fetch tags
      if: "${{ inputs.tag == '' }}"
      run: git fetch --tags origin

    - name: Get latest release tag
      id: previoustag
      if: "${{ inputs.tag == '' }}"
      uses: WyriHaximus/github-action-get-previous-tag@v1
      with:
        fallback: 1.0.0

    # CONDA_DIR is pinned so the job keeps exercising the "no conda present ->
    # install Miniconda" path. The runner image ships a conda at
    # /usr/share/miniconda and the login shell exports CONDA_EXE, which the
    # Makefile would otherwise detect and reuse.
    - name: Build Python interface via make python-interface
      working-directory: ${{ github.workspace }}
      run: make python-interface CONDA_DIR=$HOME/miniconda3 USE_CUDA=${{ matrix.cuda.use }} PY_VERSION=${{ matrix.py-version.version }}

    - name: Stage .so for dist_pypi.py
      working-directory: ${{ github.workspace }}
      run: |
        mkdir -p python/${{ matrix.cuda.libs_dir }}
        cp python/src/magtense/lib/magtensesource*.so python/${{ matrix.cuda.libs_dir }}/

    - name: Build pip-wheel
      if: "${{ inputs.tag == '' }}"
      working-directory: ${{ github.workspace }}/python/
      run: |
        sed -i 's/1.0.0/${{ steps.previoustag.outputs.tag }}/' src/magtense/__init__.py
        PY=$(make -s -C .. print-PYTHON CONDA_DIR=$HOME/miniconda3)
        "$PY" .build/dist_pypi.py \
            --py_version ${{ matrix.py-version.version }} --cu_version ${{ matrix.cuda.name }} --platform linux \
            --pkg_version ${{ steps.previoustag.outputs.tag }}

    - name: Deployment - Build pip-wheel
      if: "${{ inputs.tag != '' }}"
      working-directory: ${{ github.workspace }}/python/
      run: |
        sed -i 's/1.0.0/${{ inputs.tag }}/' src/magtense/__init__.py
        PY=$(make -s -C .. print-PYTHON CONDA_DIR=$HOME/miniconda3)
        "$PY" .build/dist_pypi.py \
            --py_version ${{ matrix.py-version.version }} --cu_version ${{ matrix.cuda.name }} --platform linux \
            --pkg_version ${{ inputs.tag }}

    - name: Archive pip-wheel
      uses: actions/upload-artifact@v4
      with:
        name: pip-wheel-py${{ matrix.py-version.version }}-${{ matrix.cuda.name }}-Linux
        path: ${{ github.workspace }}/python/dist/magtense-*-${{ matrix.cuda.build_tag }}-py${{ matrix.py-version.version }}-none-manylinux1_x86_64.whl


  test-wheel:
    runs-on: ubuntu-latest
    needs: build-wheel
    strategy:
      matrix:
        cuda:
          - { name: cu12, build_tag: 1 }
          - { name: cpu,  build_tag: 0 }
        py-version:
          - { version: "312", semver: "3.12" }
          - { version: "313", semver: "3.13" }
          - { version: "314", semver: "3.14" }
    defaults:
      run:
        shell: bash -el {0}

    steps:
    - name: Checkout test scripts
      uses: actions/checkout@v4
      with:
        sparse-checkout: |
          python/tests/
          documentation/examples_FEM_validation/

    - name: Download wheel artifact
      uses: actions/download-artifact@v4
      with:
        name: pip-wheel-py${{ matrix.py-version.version }}-${{ matrix.cuda.name }}-Linux

    - name: Setup python
      uses: actions/setup-python@v5
      with:
        python-version: "${{ matrix.py-version.semver }}"

    - name: Install pip-wheel and run pytest
      run: |
        python3 -m pip install ${{ github.workspace }}/magtense-*-${{ matrix.cuda.build_tag }}-py${{ matrix.py-version.version }}-none-manylinux1_x86_64.whl
        python3 -m pip install pytest
        pytest
