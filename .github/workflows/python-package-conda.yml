name: Python - Pip-wheel with conda

on: push

jobs:
  build-wheel:
    strategy:
      matrix:
        py-version: [312, 313]
        cvode: [0]
        sys:
          - { os: windows-latest, name: win, whl-arch: win_amd64 }
          - { os: ubuntu-latest, name: linux, whl-arch: manylinux1_x86_64 }
    runs-on: ${{ matrix.sys.os }}
    defaults:
      run:
        shell: bash -el {0}
    env:
      build_file: python/.build/env-${{ matrix.py-version }}-${{ matrix.sys.name }}.yml
      conda-env-name: magtense-env

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup msvc-dev-cmd
      if: ${{ runner.os == 'Windows' }}
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: amd64

    - name: Setup Miniforge
      uses: conda-incubator/setup-miniconda@v3
      with:
        miniforge-version: latest
        activate-environment: ${{ env.conda-env-name }}
        use-mamba: true

    - name: Cache conda
      uses: actions/cache@v4
      env:
        cache_number: 0
      with:
        path: ${{ env.CONDA }}/envs
        key: conda-${{ runner.os }}-${{ hashFiles(env.build_file) }}-${{ env.cache_number }}
      id: cache

    - name: Update environment
      run: conda env update -n ${{ env.conda-env-name }} -f ${{ env.build_file }}
      if: steps.cache.outputs.cache-hit != 'true'

    - name: Download cvode (sundials-7.2.1)
      working-directory: ${{ github.workspace }}
      if: ${{ matrix.cvode == 1 && runner.os == 'Linux' }}
      run: |
        wget https://github.com/LLNL/sundials/releases/download/v7.2.1/cvode-7.2.1.tar.gz
        tar -xf cvode-7.2.1.tar.gz
        mkdir cvode
        mv cvode-7.2.1 cvode/srcdir
        mkdir cvode/builddir
        cd ${{ github.workspace }}/cvode/builddir/
        cmake -DCMAKE_INSTALL_PREFIX=.. -DEXAMPLES_INSTALL_PATH=../examples -DCMAKE_C_COMPILER=${CONDA_PREFIX}/bin/icx -DCMAKE_C_FLAGS=-Wunused-command-line-argument -DCMAKE_Fortran_COMPILER=${CONDA_PREFIX}/bin/ifx -DBUILD_FORTRAN_MODULE_INTERFACE=ON -DENABLE_OPENMP=ON -DENABLE_CUDA=ON ../srcdir
        make
        make install
    
    - name: Create directory for wrappers of compiled Fortran source code
      run: |
        mkdir '${{ github.workspace }}'/python/cpu_libs
        mkdir '${{ github.workspace }}'/python/cu12_libs

    - name: Win - Compile Fortran source code and build Python wrapper
      if: ${{ runner.os == 'Windows' }}
      shell: pwsh -NoExit -ExecutionPolicy ByPass -File {0}
      working-directory: ${{ github.workspace }}
      run: |
        rm ${{ env.CONDA }}/envs/magtense-env/Library/usr/bin/link.exe
        make python USE_CUDA=0 USE_CVODE=0 USE_MATLAB=0
        cp magtensesource.*.pyd ${{ github.workspace }}/python/cpu_libs/
        make clean
        make python USE_CUDA=1 USE_CVODE=0 USE_MATLAB=0
        cp magtensesource.*.pyd ${{ github.workspace }}/python/cu12_libs/
        make clean

    - name: Linux - Compile Fortran source code and build Python wrapper
      if: ${{ runner.os == 'Linux' }}
      working-directory: ${{ github.workspace }}
      run: |
        make python USE_CUDA=0 USE_CVODE=${{ matrix.cvode }} USE_MATLAB=0
        cp magtensesource.*.so ${{ github.workspace }}/python/cpu_libs/
        make clean
        make python USE_CUDA=1 USE_CVODE=${{ matrix.cvode }} USE_MATLAB=0
        cp magtensesource.*.so ${{ github.workspace }}/python/cu12_libs/
        make clean

    - name: Build pip-wheels with cvode
      if: ${{ matrix.cvode == 1 && runner.os == 'Linux' }}
      working-directory: ${{ github.workspace }}/python/
      run: python .build/dist_pypi.py --py_version ${{ matrix.py-version }} --platform linux --cvode

    - name: Build pip-wheels without cvode
      if: ${{ matrix.cvode == 0 }}
      working-directory: ${{ github.workspace }}/python/
      run: python .build/dist_pypi.py --py_version ${{ matrix.py-version }} --platform ${{ matrix.sys.name }} --no-cvode

    - name: cpu - Archive pip-wheel
      uses: actions/upload-artifact@v4
      with:
        name: pip-wheel-py${{ matrix.py-version }}-cpu-${{ runner.os }}
        path: ${{ github.workspace }}/python/dist/magtense-*-0-py${{ matrix.py-version }}-none-${{ matrix.sys.whl-arch }}.whl

    - name: cu12 - Archive pip-wheel
      uses: actions/upload-artifact@v4
      with:
        name: pip-wheel-py${{ matrix.py-version }}-cu12-${{ runner.os }}
        path: ${{ github.workspace }}/python/dist/magtense-*-1-py${{ matrix.py-version }}-none-${{ matrix.sys.whl-arch }}.whl


  test-wheel:
    strategy:
      matrix:
        mt-punit: [cpu, cu12]
        py-version: [312, 313]
    runs-on: [windows-latest, ubuntu-latest]
    needs: build-wheel
    defaults:
      run:
        shell: bash -el {0}
    
    steps:
    - name: Checkout test scripts
      uses: actions/checkout@v4
      with:
        sparse-checkout: |
          python/tests/
          documentation/examples_FEM_validation/
    
    - name: Download a single artifact
      uses: actions/download-artifact@v4
      with:
        name: pip-wheel-py${{ matrix.py-version }}-${{ matrix.mt-punit }}-${{ runner.os }}

    - name: Setup python 3.12
      if: ${{ matrix.py-version == 312 }}
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    
    - name: Setup python 3.13
      if: ${{ matrix.py-version == 313 }}
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Create a new virtual environment
      run: python3 -m venv '${{ github.workspace }}'/.venv

    - name: Win - Install pip-wheel and pytest
      if: ${{ runner.os == 'Windows' }}
      run: |
        source ${{ github.workspace }}/.venv/bin/activate
        python3 -m pip install '${{ github.workspace }}'/*.whl
        python3 -m pip install pytest
        pytest

    - name: Linux - Install pip-wheel and pytest
      if: ${{ runner.os == 'Linux' }}
      run: |
        source ${{ github.workspace }}/.venv/bin/activate
        python3 -m pip install '${{ github.workspace }}'/*.whl
        python3 -m pip install pytest
        pytest
