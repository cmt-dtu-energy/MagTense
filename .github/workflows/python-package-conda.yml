name: Python pip-wheel with conda build and test on Windows and Linux

on:
  pull_request:
    branches:
      - master
  workflow_call:
    inputs:
      tag:
        required: false
        type: string
  workflow_dispatch:

jobs:
  build-wheel:
    strategy:
      matrix:
        py-version: [312, 313]
        cvode: [1]
        sys:
          - { os: windows-latest, name: win, whl-arch: win_amd64 }
          - { os: ubuntu-latest, name: linux, whl-arch: manylinux1_x86_64 }

    runs-on: ${{ matrix.sys.os }}

    # Workaround: Issue with msvc-dev-cmd and new conda installation
    needs: [cache-conda-win, build-cvode]

    defaults:
      run:
        shell: bash -el {0}

    env:
      build_file: python/.build/env-${{ matrix.py-version }}-${{ matrix.sys.name }}.yml

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Linux - Select FMM3D make.inc
      if: ${{ runner.os == 'Linux' }}
      run: cp external/FMM3D/make.inc.linux external/FMM3D/make.inc

    - name: Win - Select FMM3D make.inc
      if: ${{ runner.os == 'Windows' }}
      run: cp external/FMM3D/make.inc.windows external/FMM3D/make.inc

    - name: Fetch tags
      if: "${{ inputs.tag == '' }}"
      run: git fetch --tags origin

    - name: Get latest release tag
      id: previoustag
      if: "${{ inputs.tag == '' }}"
      uses: WyriHaximus/github-action-get-previous-tag@v1
      with:
        fallback: 1.0.0

    - name: Setup msvc-dev-cmd
      if: ${{ runner.os == 'Windows' }}
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: amd64

    - name: Setup Miniforge
      uses: conda-incubator/setup-miniconda@v3
      with:
        miniforge-version: latest
        activate-environment: magtense-env
        use-mamba: true

    # Install compiler into base
    - name: Install compiler in base (Linux)
      if: runner.os == 'Linux'
      run: conda install -n base -c conda-forge gxx_linux-64 -y

    - name: Cache conda
      uses: actions/cache@v4
      env:
        cache_number: 0
      with:
        path: ${{ env.CONDA }}/envs
        key: conda-${{ runner.os }}-${{ hashFiles(env.build_file) }}-${{ env.cache_number }}
      id: cache

    - name: Update environment
      run: conda env update -f ${{ env.build_file }}
      if: steps.cache.outputs.cache-hit != 'true'

    - name: Download cvode (sundials-7.2.1)
      if: ${{ matrix.cvode == 1 }}
      uses: actions/download-artifact@v4
      with:
        name: cvode-${{ runner.os }}
        path: ${{ github.workspace }}/cvode/

    - name: Create directory for wrappers of compiled Fortran source code
      run: |
        mkdir '${{ github.workspace }}'/python/cpu_libs
        mkdir '${{ github.workspace }}'/python/cu12_libs
        mkdir '${{ github.workspace }}'/python/cu12-fmm_libs

    # Workaround: Issue with msvc-dev-cmd and link.exe in the conda environment
    - name: Win - Delete link.exe
      if: ${{ runner.os == 'Windows' }}
      run: rm '${{ env.CONDA }}'/envs/magtense-env/Library/usr/bin/link.exe

    # Shell cannot use job/matrix templates: https://github.com/actions/runner/issues/444
    - name: Win - Compile Fortran source code and build Python wrapper
      if: ${{ runner.os == 'Windows' }}
      shell: pwsh -NoExit -ExecutionPolicy ByPass -File {0}
      working-directory: ${{ github.workspace }}
      run: |
        make python USE_CUDA=0 USE_CVODE=${{ matrix.cvode }} USE_MATLAB=0
        cp magtensesource.* ${{ github.workspace }}/python/cpu_libs/
        make clean

        make python USE_CUDA=1 USE_CVODE=${{ matrix.cvode }} USE_MATLAB=0
        cp magtensesource.* ${{ github.workspace }}/python/cu12_libs/
        make clean

        make python USE_CUDA=1 USE_CVODE=0 USE_MATLAB=0 USE_FMM3D=1
        cp magtensesource.* ${{ github.workspace }}/python/cu12-fmm_libs/
        cp external/FMM3D/local/libfmm3d.dll ${{ github.workspace }}/python/cu12-fmm_libs/
        make clean

    - name: Linux - Compile Fortran source code and build Python wrapper
      if: ${{ runner.os == 'Linux' }}
      working-directory: ${{ github.workspace }}
      run: |
        make python USE_CUDA=0 USE_CVODE=${{ matrix.cvode }} USE_MATLAB=0
        cp magtensesource.* '${{ github.workspace }}'/python/cpu_libs/
        make clean

        make python USE_CUDA=1 USE_CVODE=${{ matrix.cvode }} USE_MATLAB=0
        cp magtensesource.* '${{ github.workspace }}'/python/cu12_libs/
        make clean

        make python USE_CUDA=1 USE_CVODE=0 USE_MATLAB=0 USE_FMM3D=1
        cp magtensesource.* '${{ github.workspace }}'/python/cu12-fmm_libs/
        cp external/FMM3D/local/libfmm3d.so '${{ github.workspace }}'/python/cu12-fmm_libs/
        make clean

    - name: Build pip-wheels
      if: "${{ inputs.tag == '' }}"
      working-directory: ${{ github.workspace }}/python/
      run: |
        sed -i 's/1.0.0/${{ steps.previoustag.outputs.tag }}/' src/magtense/__init__.py
        python .build/dist_pypi.py --py_version ${{ matrix.py-version }} --cu_version cpu,cu12,cu12-fmm --platform ${{ matrix.sys.name }} --pkg_version ${{ steps.previoustag.outputs.tag }}

    - name: Deployment - Build pip-wheels
      if: "${{ inputs.tag != '' }}"
      working-directory: ${{ github.workspace }}/python/
      run: |
        sed -i 's/1.0.0/${{ inputs.tag }}/' src/magtense/__init__.py
        python .build/dist_pypi.py --py_version ${{ matrix.py-version }} --cu_version cpu,cu12,cu12-fmm --platform ${{ matrix.sys.name }} --pkg_version ${{ inputs.tag }}

    - name: cpu - Archive pip-wheel
      uses: actions/upload-artifact@v4
      with:
        name: pip-wheel-py${{ matrix.py-version }}-cpu-${{ runner.os }}
        path: ${{ github.workspace }}/python/dist/magtense-*-0-py${{ matrix.py-version }}-none-${{ matrix.sys.whl-arch }}.whl

    - name: cu12 - Archive pip-wheel
      uses: actions/upload-artifact@v4
      with:
        name: pip-wheel-py${{ matrix.py-version }}-cu12-${{ runner.os }}
        path: ${{ github.workspace }}/python/dist/magtense-*-1-py${{ matrix.py-version }}-none-${{ matrix.sys.whl-arch }}.whl

    - name: cu12-fmm - Archive pip-wheel
      uses: actions/upload-artifact@v4
      with:
        name: pip-wheel-py${{ matrix.py-version }}-cu12-fmm-${{ runner.os }}
        path: ${{ github.workspace }}/python/dist/magtense-*-3-py${{ matrix.py-version }}-none-${{ matrix.sys.whl-arch }}.whl


  test-wheel:
    strategy:
      matrix:
        mt-punit:
          - { name: cpu, fmm3d: 0 }
          - { name: cu12, fmm3d: 0 }
        py-version:
          - { name: 312, id: "3.12" }
          - { name: 313, id: "3.13" }
        os: [windows-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    needs: build-wheel

    defaults:
      run:
        shell: bash -el {0}

    steps:
    - name: Checkout test scripts
      uses: actions/checkout@v4
      with:
        sparse-checkout: |
          python/tests/
          python/src/utils/
          documentation/examples_FEM_validation/

    - name: Download a single artifact
      uses: actions/download-artifact@v4
      with:
        name: pip-wheel-py${{ matrix.py-version.name }}-${{ matrix.mt-punit.name }}-${{ runner.os }}

    - name: Setup python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.py-version.id }}

    - name: Install pip-wheel and pytest
      env:
        MAGTENSE_USE_FMM3D: ${{ matrix.mt-punit.fmm3d }}
        MAGTENSE_WHEEL_VARIANT: ${{ matrix.mt-punit.name }}
      run: |
        python -m pip install '${{ github.workspace }}'/*.whl
        python -m pip install pytest
        python -m pytest python/tests/test_magtense.py


  test-wheel-fmm-cuda:
    strategy:
      matrix:
        py-version:
          - { name: 312, id: "3.12" }
          - { name: 313, id: "3.13" }
        fmm_runner:
          - { os_name: linux, labels: '["self-hosted", "Linux", "CUDA"]' }
          - { os_name: windows, labels: '["self-hosted", "Windows", "CUDA"]' }

    runs-on: ${{ fromJSON(matrix.fmm_runner.labels) }}

    needs: build-wheel

    defaults:
      run:
        shell: bash -el {0}

    steps:
    - name: Checkout test scripts
      uses: actions/checkout@v4
      with:
        sparse-checkout: |
          python/tests/
          python/src/utils/
          documentation/examples_FEM_validation/

    - name: Download cu12-fmm artifact
      uses: actions/download-artifact@v4
      with:
        name: pip-wheel-py${{ matrix.py-version.name }}-cu12-fmm-${{ runner.os }}

    - name: Python diagnostics before setup (Windows)
      if: ${{ matrix.fmm_runner.os_name == 'windows' }}
      shell: cmd
      run: |
        echo RUNNER_TOOL_CACHE=%RUNNER_TOOL_CACHE%
        echo AGENT_TOOLSDIRECTORY=%AGENT_TOOLSDIRECTORY%
        where python || ver > nul
        python --version || ver > nul
        py -0p || ver > nul

    - name: Setup python (Linux self-hosted)
      if: ${{ matrix.fmm_runner.os_name == 'linux' }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.py-version.id }}
        check-latest: true

    - name: Select python (Linux self-hosted)
      if: ${{ matrix.fmm_runner.os_name == 'linux' }}
      run: |
        echo "PYTHON_EXE=$(command -v python)" >> "$GITHUB_ENV"

    - name: Select python (Windows self-hosted)
      if: ${{ matrix.fmm_runner.os_name == 'windows' }}
      shell: pwsh
      run: |
        $condaBat = 'C:\Users\github_runner\miniconda3\condabin\conda.bat'
        if (Test-Path $condaBat) {
          $hook = & cmd.exe /c "`"$condaBat`" shell.powershell hook"
          Invoke-Expression $hook
          conda activate
          "PATH=$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        } else {
          Write-Warning "Conda not found at $condaBat"
        }

        try {
          $py = python -c 'import sys; print(sys.executable)'
          "PYTHON_EXE=$py" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        } catch {
          $wanted = '${{ matrix.py-version.id }}'
          $candidate = & py "-$wanted" -c "import sys; print(sys.executable)" 2>$null
          if ($LASTEXITCODE -eq 0 -and $candidate) {
            "PYTHON_EXE=$candidate" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } else {
            throw "Python $wanted was not found."
          }
        }

    - name: Python diagnostics after setup
      if: ${{ matrix.fmm_runner.os_name == 'linux' }}
      run: |
        echo "PYTHON_EXE=$PYTHON_EXE"
        "$PYTHON_EXE" --version
        which "$PYTHON_EXE"
        "$PYTHON_EXE" -c "import sys; print('selected:', sys.executable)"

    - name: Python diagnostics after setup (Windows)
      if: ${{ matrix.fmm_runner.os_name == 'windows' }}
      shell: cmd
      run: |
        echo RUNNER_TOOL_CACHE=%RUNNER_TOOL_CACHE%
        echo AGENT_TOOLSDIRECTORY=%AGENT_TOOLSDIRECTORY%
        echo PYTHON_EXE=%PYTHON_EXE%
        where python || ver > nul
        python --version || ver > nul
        py -0p || ver > nul
        "%PYTHON_EXE%" --version
        "%PYTHON_EXE%" -c "import sys; print('selected:', sys.executable)"

    - name: Show CUDA device info
      if: ${{ matrix.fmm_runner.os_name == 'linux' }}
      run: |
        "$PYTHON_EXE" -c "import shutil; print('nvidia-smi:', shutil.which('nvidia-smi'))"
        nvidia-smi

    - name: Show CUDA device info (Windows)
      if: ${{ matrix.fmm_runner.os_name == 'windows' }}
      shell: cmd
      run: |
        "%PYTHON_EXE%" -c "import shutil; print('nvidia-smi:', shutil.which('nvidia-smi'))"
        nvidia-smi

    - name: Install pip-wheel and pytest
      if: ${{ matrix.fmm_runner.os_name == 'linux' }}
      env:
        MAGTENSE_USE_FMM3D: 1
        MAGTENSE_WHEEL_VARIANT: cu12-fmm
      run: |
        "$PYTHON_EXE" -m pip install '${{ github.workspace }}'/*.whl
        "$PYTHON_EXE" -m pip install pytest
        "$PYTHON_EXE" -m pytest python/tests/fmm_test/test_fmm_workflow.py

    - name: Install pip-wheel and pytest (Windows)
      if: ${{ matrix.fmm_runner.os_name == 'windows' }}
      shell: cmd
      env:
        MAGTENSE_USE_FMM3D: 1
        MAGTENSE_WHEEL_VARIANT: cu12-fmm
      run: |
        for %%f in ("%GITHUB_WORKSPACE%\*.whl") do "%PYTHON_EXE%" -m pip install "%%f"
        "%PYTHON_EXE%" -m pip install pytest
        "%PYTHON_EXE%" -m pytest python/tests/fmm_test/test_fmm_workflow.py


  cache-conda-win:
    strategy:
      matrix:
        py-version: [312, 313]

    runs-on: windows-latest

    env:
      build_file: python/.build/env-${{ matrix.py-version }}-win.yml

    steps:
    - name: Checkout environment file
      uses: actions/checkout@v4
      with:
        sparse-checkout: |
          python/.build/

    - name: Install VS2017 build tools
      run: |
        choco install visualstudio2017buildtools -y

    - name: Setup Miniforge
      uses: conda-incubator/setup-miniconda@v3
      with:
        miniforge-version: latest
        activate-environment: magtense-env
        use-mamba: true

    - name: Cache conda
      uses: actions/cache@v4
      env:
        cache_number: 0
      with:
        path: ${{ env.CONDA }}/envs
        key: conda-${{ runner.os }}-${{ hashFiles(env.build_file) }}-${{ env.cache_number }}
      id: cache

    - name: Update environment
      run: conda env update -f ${{ env.build_file }}
      if: steps.cache.outputs.cache-hit != 'true'


  build-cvode:
    name: cvode
    uses: ./.github/workflows/cmake-sundials-cvode.yml