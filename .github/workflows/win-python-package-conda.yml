name: Win - Python package using conda / pip

on: [push]

jobs:
  build-win:
    strategy:
      matrix:
        py-version: [312]
        cvode: [1]
    runs-on: windows-latest
    defaults:
      run:
        shell: bash -el {0} # pwsh -NoExit -ExecutionPolicy ByPass -File {0}
    env:
      build_file: python/.build/env-312-win.yml

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup msvc-dev-cmd
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: amd64

    - name: Setup Miniforge
      uses: conda-incubator/setup-miniconda@v3
      with:
        miniforge-version: latest
        activate-environment: magtense-env
        use-mamba: true

    - name: Cache conda
      uses: actions/cache@v4
      env:
        # Increase this value to reset cache manually
        cache_number: 0
      with:
        path: ${{ env.CONDA }}/envs
        key: conda-${{ runner.os }}-${{ hashFiles(env.build_file) }}-${{ env.cache_number }}
      id: cache

    - name: Update environment
      run: conda env update -n magtense-env -f ${{ env.build_file }}
      if: steps.cache.outputs.cache-hit != 'true'

    - name: Download cvode (sundials-7.2.1)
      shell: pwsh -NoExit -ExecutionPolicy ByPass -File {0}
      working-directory: ${{ github.workspace }}
      if: ${{ matrix.cvode == 1 }}
      run: |
        (new-object System.Net.WebClient).DownloadFile("https://github.com/LLNL/sundials/releases/download/v7.2.1/cvode-7.2.1.tar.gz", "${{ github.workspace }}/cvode-7.2.1.tar.gz")
        tar -xf cvode-7.2.1.tar.gz
        mkdir cvode
        mv cvode-7.2.1 cvode/srcdir
        mkdir cvode/builddir

    - name: Compile cvode for Fortran
      working-directory: ${{ github.workspace }}/cvode/builddir/
      if: ${{ matrix.cvode == 1 }}
      run: |
        cmake -DCMAKE_INSTALL_PREFIX=.. -DEXAMPLES_INSTALL_PATH=../examples -DCMAKE_Fortran_COMPILER=C:/Users/runneradmin/miniconda3/envs/magtense-env/Library/bin/ifx.exe -DBUILD_FORTRAN_MODULE_INTERFACE=ON -DENABLE_OPENMP=ON -DENABLE_CUDA=ON ../srcdir
        make
        make install
    
    - name: Create directory for wrappers of compiled Fortran source code
      run: |
        mkdir '${{ github.workspace }}'/python/cpu_libs
        mkdir '${{ github.workspace }}'/python/cu12_libs

    - name: Compile Fortran files
      shell: pwsh -NoExit -ExecutionPolicy ByPass -File {0}
      working-directory: ${{ github.workspace }}
      run: |
        rm ${{ env.CONDA }}/envs/magtense-env/Library/usr/bin/link.exe
        make python USE_CUDA=0 USE_CVODE=0 USE_MATLAB=0
        cp magtensesource.*.pyd ${{ github.workspace }}/python/cpu_libs/
        make clean
        make python USE_CUDA=1 USE_CVODE=0 USE_MATLAB=0
        cp magtensesource.*.pyd ${{ github.workspace }}/python/cu12_libs/
        make clean

    - name: Build pip-wheels without cvode
      if: ${{ matrix.cvode == 1 }}
      working-directory: ${{ github.workspace }}/python/
      run: python .build/dist_pypi.py --py_version ${{ matrix.py-version }} --platform win --no-cvode

    - name: Build pip-wheels without cvode
      if: ${{ matrix.cvode == 0 }}
      working-directory: ${{ github.workspace }}/python/
      run: python .build/dist_pypi.py --py_version ${{ matrix.py-version }} --platform win --no-cvode

    - name: cpu - Archive pip-wheel
      uses: actions/upload-artifact@v4
      with:
        name: pip-wheel-py${{ matrix.py-version }}-cpu
        path: ${{ github.workspace }}/python/dist/magtense-*-0-py${{ matrix.py-version }}-none-win_amd64.whl

    - name: cu12 - Archive pip-wheel
      uses: actions/upload-artifact@v4
      with:
        name: pip-wheel-py${{ matrix.py-version }}-cu12
        path: ${{ github.workspace }}/python/dist/magtense-*-1-py${{ matrix.py-version }}-none-win_amd64.whl

  test-win:
    strategy:
      matrix:
        mt-punit: [cpu, cu12]
        py-version: [312]
    runs-on: windows-latest
    needs: build-win
    defaults:
      run:
        shell: bash -el {0}
    
    steps:
    - name: Checkout test scripts
      uses: actions/checkout@v4
      with:
        sparse-checkout: |
          python/tests/
          documentation/examples_FEM_validation/
    
    - name: Download a single artifact
      uses: actions/download-artifact@v4
      with:
        name: pip-wheel-py${{ matrix.py-version }}-${{ matrix.mt-punit }}

    - name: Setup python 3.12
      if: ${{ matrix.py-version == 312 }}
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    
    - name: Setup python 3.13
      if: ${{ matrix.py-version == 313 }}
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Create a new virtual environment
      run: python3 -m venv '${{ github.workspace }}'/.venv

    - name: Install pip-wheel and pytest
      run: |
        '${{ github.workspace }}'/.venv/Scripts/activate
        python3 -m pip install '${{ github.workspace }}'/*.whl
        python3 -m pip install pytest

    - name: Run tests
      run: |
        '${{ github.workspace }}'/.venv/Scripts/activate
        pytest
