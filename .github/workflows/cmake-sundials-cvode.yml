name: Build and Test - Windows/intel/ninja (short)

on: push

jobs:
  build_and_test:
    runs-on: windows-latest

    steps:
    - uses: fortran-lang/setup-fortran@v1
      id: setup-fortran
      with:
        compiler: intel
        version: '2023.2'

    - name: Install Ninja
      run: choco install ninja

    - uses: actions/checkout@v4
      with:
        repository: LLNL/sundials
        ref: 'v7.2.1'

    - name: Configure CMake (Static)
      run: cmake -G "Visual Studio 17 2022" -B ${{github.workspace}}/build_static -DCMAKE_Fortran_COMPILER=ifx -DBUILD_STATIC_LIBS=ON -DBUILD_SHARED_LIBS=OFF -DBUILD_FORTRAN_MODULE_INTERFACE=ON -DSUNDIALS_BUILD_WITH_PROFILING=ON -DSUNDIALS_TEST_ENABLE_UNIT_TESTS=OFF -DEXAMPLES_ENABLE_CXX=ON

    - name: Build (Static)
      run: cmake --build ${{github.workspace}}/build_static --verbose

    - name: Test (Static)
      working-directory: ${{github.workspace}}/build_static
      run: ctest -C Release --output-on-failure

    - name: Configure CMake (Shared)
      run: cmake -G "Visual Studio 17 2022" -B ${{github.workspace}}/build_shared -DCMAKE_Fortran_COMPILER=ifx -DBUILD_STATIC_LIBS=OFF -DBUILD_SHARED_LIBS=ON -DBUILD_FORTRAN_MODULE_INTERFACE=ON -DSUNDIALS_BUILD_WITH_PROFILING=ON -DSUNDIALS_TEST_ENABLE_UNIT_TESTS=OFF -DEXAMPLES_ENABLE_CXX=ON

    - name: Build (Shared)
      run: cmake --build ${{github.workspace}}/build_shared --verbose

    - name: Test (Shared)
      working-directory: ${{github.workspace}}/build_shared
      run: ctest -C Release --output-on-failure
