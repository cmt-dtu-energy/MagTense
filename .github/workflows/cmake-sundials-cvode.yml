name: cvode - Build with win/intel/ninja + linux/intel

on: workflow_call

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

jobs:
  build-and-test:
    strategy:
      matrix:
        # windows-latest and windows-2025 both moved to Visual Studio 2026 in
        # June 2026. oneAPI 2025.0 predates it, and CUDA 12.8's nvcc rejects it
        # outright in matlab_package.yml, so pin the whole pipeline to the last
        # VS 2022 image. See the CUDA note in matlab_package.yml.
        os: [windows-2022, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: fortran-lang/setup-fortran@v1
      id: setup-fortran
      with:
        compiler: intel
        version: '2025.0'

    # icx-cl/ifx link against the MSVC CRT and Windows SDK, but oneAPI's
    # setvars.bat does not pick up the toolset on the current runner image,
    # leaving LIB without kernel32.lib etc. Set the MSVC env explicitly.
    - name: Win - Setup msvc-dev-cmd
      if: ${{ runner.os == 'Windows' }}
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: amd64

    # - uses: Jimver/cuda-toolkit@v0.2.22
    #   id: cuda-toolkit
    #   with:
    #     cuda: '12.8.1'
    #     # sub-packages: '["nvcc", "cusparse", "cublas", "cudart", "nvjitlink"]'

    - name: Install Ninja
      if: ${{ runner.os == 'Windows' }}
      run: choco install ninja

    - uses: actions/checkout@v4
      with:
        repository: LLNL/sundials
        ref: 'v7.2.1'

    - name: Setup MSVC environment
      if: ${{ runner.os == 'Windows' }}
      uses: ilammy/msvc-dev-cmd@v1

    - name: Win - Configure CMake
      if: ${{ runner.os == 'Windows' }}
      run: |
        mkdir ${{github.workspace}}/install
        cmake -G "Ninja" -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DBUILD_ARKODE=OFF -DBUILD_CVODE=ON -DBUILD_CVODES=OFF -DBUILD_IDA=OFF -DBUILD_IDAS=OFF -DBUILD_KINSOL=OFF -DBUILD_SHARED_LIBS=OFF -DBUILD_STATIC_LIBS=ON -DCMAKE_INSTALL_PREFIX=${{github.workspace}}/install -DEXAMPLES_INSTALL_PATH=${{github.workspace}}/install/examples -DCMAKE_C_FLAGS=-Wno-deprecated-declarations -DCMAKE_C_COMPILER=icx-cl -DCMAKE_CXX_COMPILER=icx-cl -DCMAKE_Fortran_COMPILER=ifx -DBUILD_FORTRAN_MODULE_INTERFACE=ON -DENABLE_OPENMP=ON

    - name: Linux - Configure CMake
      if: ${{ runner.os == 'Linux' }}
      working-directory: ${{ github.workspace }}
      run: |
        mkdir ${{ github.workspace }}/install
        cmake \
        -B ${{github.workspace}}/build \
        -D CMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} \
        -D BUILD_ARKODE=OFF \
        -D BUILD_CVODE=ON \
        -D BUILD_CVODES=OFF \
        -D BUILD_IDA=OFF \
        -D BUILD_IDAS=OFF \
        -D BUILD_KINSOL=OFF \
        -D BUILD_SHARED_LIBS=OFF \
        -D BUILD_STATIC_LIBS=ON \
        -D CMAKE_INSTALL_PREFIX=${{github.workspace}}/install \
        -D EXAMPLES_INSTALL_PATH=${{github.workspace}}/install/examples \
        -D CMAKE_C_COMPILER=$(which icx) \
        -D CMAKE_Fortran_COMPILER=$(which ifx) \
        -D BUILD_FORTRAN_MODULE_INTERFACE=ON \
        -D ENABLE_OPENMP=ON
        
    - name: Build and install
      run: |
        cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}} --verbose
        cmake --install ${{github.workspace}}/build --verbose

    - name: Archive cvode libraries
      uses: actions/upload-artifact@v4
      with:
        name: cvode-${{ runner.os }}
        path: ${{github.workspace}}/install
