  # CUDA toolkit from conda-forge. Loose pins on purpose: the exact
  # nvidia-label builds this file used to pin were dropped from the
  # channel and no longer solve. The -dev packages ship the Windows
  # import libs (Library/lib/x64/*.lib) MSVC needs; conda pulls nvcc,
  # the CUDA runtime and cuda-version transitively.
  - cuda-nvcc
  - cuda-cudart-dev
  - libcublas-dev
  - libcusparse-dev
  - pip:
      - build==1.4.0
      - charset-normalizer==3.4.6
      - colorama==0.4.6
      - meson==1.10.2
      - numpy==2.4.3
      - packaging==26.0
      - pyproject-hooks==1.2.0
      - pytest
